<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <main>
        <form onsubmit="loggInn(event)">
            <label for="fornavn">Fornavn:</label>
            <input type="text" id="fornavn" name="fornavn" required>

            <!-- <label for="etternavn">Etternavn:</label>
            <input type="text" id="etternavn" name="etternavn" required> -->

            <label for="passord">Passord:</label>
            <input type="password" id="passord" name="passord" required>

            <button type="submit">Submit</button>
        </form>
        <p>New user? <a href="/newUser.html">Registrer deg</a></p>
    </main>
<script>
    async function loggInn(event) {
        event.preventDefault();

        const fornavn = document.getElementById("fornavn").value;
        const passord = document.getElementById("passord").value;

        const response = await fetch("/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ fornavn, passord })
        });

        const result = await response.json();
        if (!response) {
            alert(result.message);
            window.location.href = result.redirect;
        } else {
            alert(result.message);
        }
    }
</script>
</body>
</html>
